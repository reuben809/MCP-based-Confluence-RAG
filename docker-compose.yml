# ============================================
# MCP-based Confluence RAG - Docker Compose
# ============================================
# Qdrant-only architecture (no MongoDB)
# Fresh volume for clean skeleton index

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: skeleton_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC API
    volumes:
      - skeleton_qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  skeleton_qdrant_data:
    name: confluence_rag_qdrant
